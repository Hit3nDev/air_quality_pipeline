name: daily pipeline smoke test

# Runs the real pipeline against the live Open-Meteo API once a day (01:30 UTC = 07:00 IST).
# It proves the API contract and the full ETL still work; the data is thrown away with the runner.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the pipeline (92-day backfill into an empty database)
        run: python pipeline.py --backfill
      - name: Check the run succeeded and the data looks sane
        run: python scripts/smoke_check.py
      - name: Keep the generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
